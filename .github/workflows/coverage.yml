# Line/region coverage of the sans-IO core, via cargo-llvm-cov (issue #102).
#
# A discovery tool, not a gate: it prints a per-file summary to the job log so untested branches in
# the connect/session state machines and the codec decoders surface as concrete test gaps (feeding
# the robustness work — ADR-0008 / #98). No threshold, so it never fails a build on coverage alone.
#
# Scope is the sans-IO core (justrdp-pdu + justrdp + justrdp-codecs); the I/O adapter (justrdp-tokio)
# is excluded — its integration tests need the real VM and are #[ignore]d in CI, so measuring it here
# would report misleadingly-low numbers for code that is deliberately not unit-tested.
#
# Runs post-merge on master and on demand (not per-PR) to keep it low-ceremony. cargo-llvm-cov is
# installed with `cargo install` rather than a marketplace action, so no new third-party action needs
# SHA-pinning (ADR-0006). Confirmed to run on stable Windows MSVC locally too (issue #102), so the
# maintainer can reproduce this off-CI — and since #235 that reproduction is exact, because the
# compiler is pinned rather than whatever `stable` meant on the day (ADR-0013).
name: coverage

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege (just-shield R7): the job only reads the repo.
permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # The pinned toolchain (ADR-0013) plus one component only this job needs. `llvm-tools-preview`
      # stays out of `rust-toolchain.toml` deliberately: that file is every contributor's and every
      # job's, and coverage is the only consumer.
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Measure coverage (sans-IO core)
        run: cargo llvm-cov --workspace --exclude justrdp-tokio --summary-only
