# Build / format / lint / test gate for the workspace.
#
# Previously dropped (commit 2ca6c87) over a concern that SHA-pinning the workflow's actions would
# be unmanageable to maintain. That concern is resolved: actions are pinned by `just-shield fix`
# and kept current by the github-actions Dependabot ecosystem (ADR-0006), so the pins stay
# immutable and up to date with no manual upkeep. Reinstated on that basis.
#
# Runs on the toolchain `rust-toolchain.toml` pins (ADR-0013), so this gate and the maintainer's
# local one are the same compiler — before the pin they were three months apart and a PR went red on
# 40 pre-existing sites it never touched (#235). No nightly needed: the proptest robustness
# properties (ADR-0008) ride in `cargo test --workspace` here; the libFuzzer lane is separate
# (fuzz.yml) and selects nightly explicitly, which outranks the pin.
name: test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # THE INCIDENT MEASUREMENT FOR THE WHOLE REPO LIVES HERE. Every other workflow carries a
    # bound and a one-line pointer back to this block rather than a copy of these numbers.
    #
    # A job with no `timeout-minutes` gets GitHub's default of 360, so a hang costs six runner-
    # hours and is indistinguishable from a slow queue (#262). Measured job-level over the last
    # 120 runs, this job's duration is bimodal with nothing between 3.3 and 140 minutes: healthy
    # runs are 2-3 minutes, and unhealthy ones run to the kill.
    #
    #   test      6 jobs cancelled at 140 / 360 / 360 / 360 / 360 / 361 min = 32.4 runner-hours
    #   coverage  4 jobs cancelled at 360 min each                          = 24.0 runner-hours
    #                                                                 total ~56.4 runner-hours
    #
    # `coverage.yml` is in that table because it runs `cargo llvm-cov --workspace --exclude
    # justrdp-tokio`, i.e. the *same* justrdp-codecs property — so the incident was never confined
    # to this file, and bounding only this file would have left 24 of those 56 hours unbounded on
    # the post-merge lane nobody watches a PR check for. #262 named `test.yml`; the requirement it
    # gave ("bound every future hang, not this one") is what is actually implemented.
    #
    # The two runs that *looked* long at 31 and 105 minutes were queue time — job-level, both took
    # 2 minutes. So 20 is ~6x the worst healthy run and cannot reach a legitimate one (checked
    # against the cold-cache case: the toolchain-pin bumps rotate the rust-cache key, and the
    # pin commit's own run is the window's slowest healthy one at 3.35 min -- still 6x inside).
    #
    # This is deliberately not folded into the `to_rgba` guard that closed the seed: a guard fixes
    # one defect, a bound fixes the class. `proptest-regressions/` cannot back it up either — a
    # hang never shrinks, so it never lands there.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No toolchain named here on purpose: argless `install` reads `rust-toolchain.toml`, which
      # carries the channel, `profile = "minimal"` and the clippy/rustfmt components. Naming
      # `stable` would install a second, *different* compiler that the pin then overrides — the
      # gate would still be right and the log would be a lie about what ran.
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Gate for docs/map/ (the dependency graph). Its own job, not a step of `test`: it needs no Rust
  # toolchain and no cache, so it starts and finishes while the build is still compiling — and a
  # docs-only PR gets its answer without waiting for cargo.
  #
  # No new third-party action to pin (ADR-0006): the checkout below reuses the same SHA as the job
  # above, and the checker is stdlib Python already present on the runner.
  #
  # What it catches that nothing else does: a broken `#anchor` fails *silently* — it falls back to
  # the top of the target document, so a link that used to land on one row starts pointing at a
  # whole file and the reader is misrouted without a signal. Plus symbol/path resolution under
  # `## Code` (the map carries symbols, never line numbers), the per-kind section set (an empty
  # section is a finding, so it may not be deleted), and invariant<->territory reciprocity, which
  # found four one-way edges on its first run.
  map:
    runs-on: ubuntu-latest
    # Stdlib Python over a few dozen Markdown files: this job has completed in under a minute on
    # every one of the last 30 runs. 10 is far past any of them and still bounds a runaway.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # The gate's own defect kinds, before it is trusted to judge the notes. The
      # territory note used to record that this had been verified by hand once (#224);
      # a memory of a verification is the shape #200's hand-kept matrix had, so it is a
      # command now. Builds a throwaway mini-map in a temp dir, breaks one thing at a
      # time, and requires the gate to notice each one.
      - name: Map gate self-test (does it still fail on each defect kind?)
        run: python3 .github/scripts/check_map.py --selftest

      - name: Map gate (links, anchors, symbols, sections, reciprocity)
        run: python3 .github/scripts/check_map.py
