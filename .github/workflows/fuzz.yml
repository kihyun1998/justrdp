# Coverage-guided fuzzing of the untrusted-input decoders (ADR-0008, issue #99).
#
# CI-only by necessity: libFuzzer needs the nightly toolchain and is effectively unsupported on
# the maintainer's stable Windows MSVC host, so this lane lives on Ubuntu and never runs locally.
# It is the counterpart to the in-crate `proptest` no-panic properties — libFuzzer's `-timeout`
# catches hangs that proptest cannot, and coverage guidance reaches deeper paths.
#
# Non-blocking: this runs on a weekly schedule (and on demand), never as a per-PR merge gate.
#
# The target list is **derived, never listed here** (#200). A hand-kept matrix duplicated a roster
# the filesystem already answers, and drifted twice without a signal: `nscodec` landed in #143 and
# `progressive` in #192, and neither PR touched the copy — so both decoders sat in the repo with a
# compiling fuzz target that CI had never once executed. The `targets` job below reads
# `fuzz/fuzz_targets/`, so a new target is in the next run's matrix.
name: fuzz

on:
  schedule:
    # Weekly, Sunday 04:17 UTC.
    - cron: "17 4 * * 0"
  workflow_dispatch:

# Least privilege (just-shield R7): the fuzz job only reads the repo.
permissions:
  contents: read

jobs:
  # The roster, derived once from the directory so the matrix below cannot disagree with it.
  # `test.yml`'s `fuzz-roster` job runs the same script on every PR; the reason it reads the
  # directory is in docs/map/territory/supply-chain-and-gates.md.
  #
  # No new third-party action to pin (ADR-0006): the checkout reuses the SHA the fuzz job below
  # already carries, and `python3` is present on the runner with no setup step.
  targets:
    runs-on: ubuntu-latest
    # Bounded for the same reason as `test.yml`'s jobs, whose block carries the incident
    # measurement (#262): an unbounded job burns six runner-hours before GitHub kills it.
    # Derives the matrix with stdlib Python; seconds.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive the target list from fuzz/fuzz_targets/
        id: derive
        run: python3 .github/scripts/check_fuzz_roster.py

  fuzz:
    needs: targets
    runs-on: ubuntu-latest
    # Bounded for the same reason as `test.yml`'s jobs, whose block carries the incident
    # measurement (#262): an unbounded job burns six runner-hours before GitHub kills it.
    # The fuzzing itself is already self-bounded (`-max_total_time=300`); the nightly
    # install and the target build are not, which is the part this covers.
    timeout-minutes: 30
    strategy:
      # One target's crash must not cancel the others — each is an independent safety net.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nightly is named explicitly here and every `fuzz` invocation below says `+nightly`, which
      # outranks `rust-toolchain.toml` in rustup's override order — so the ADR-0013 pin does not
      # reach libFuzzer, which needs nightly by construction. It *does* reach `cargo install`
      # below, which is the intent (one reproducible compiler builds the tool); the boundary
      # condition is that a pin left far enough behind cargo-fuzz's own MSRV would fail here
      # rather than in the fuzzing itself.
      - name: Install nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked

      # Restore this target's corpus from the most recent run (prefix match); the run-id-keyed
      # save below means each run writes a fresh immutable cache entry.
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # After the restore, never before it: seeding is additive, so it must land beside the corpus
      # libFuzzer evolved rather than replacing it. A target with no seeder is a no-op.
      #
      # Not every target needs this, and which do is measured rather than assumed — see the script.
      # The short version: `progressive`'s first run ever retained 6 inputs totalling 29 bytes from
      # 149M executions, because a magic-plus-nested-lengths grammar is a wall a mutator cannot
      # climb from empty. `nscodec`, cold in the same run, reached 85 inputs / 9477 bytes.
      - name: Seed ${{ matrix.target }} corpus from committed fixtures
        run: python3 .github/scripts/seed_fuzz_corpus.py ${{ matrix.target }}

      # -max_total_time bounds the run; -timeout=10 fails an input that runs >10s, which is how
      # hangs (infinite loops) are caught — the gap proptest leaves open.
      - name: Fuzz ${{ matrix.target }}
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300 -timeout=10

      - name: Save corpus
        if: ${{ always() && !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # A crash leaves a reproducer under fuzz/artifacts/<target>/; upload it and let the job fail.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
