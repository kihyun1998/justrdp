[package]
name = "justrdp"
description = "A from-scratch, sans-IO RDP client library."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
justrdp-pdu.workspace = true
# The slow-path graphics codecs (slice-6): the session machine decodes bitmap rectangles
# through this crate's pure decode API (ADR-0003).
justrdp-codecs.workspace = true
# X.509 parsing (ADR-0002 leaf dependency). The sans-IO core extracts the server certificate's
# inner `subjectPublicKey` BIT STRING (not the whole SubjectPublicKeyInfo) for CredSSP to bind
# to; the handshake itself stays in the I/O adapter.
x509-cert.workspace = true
# Structured observability (plan.md §11d): PDU-milestone debug events (deactivate/demand-active/
# drdynvc traffic) with named targets the test harness' tracing watchers assert on. A no-op
# without a subscriber, so sans-IO purity and portability are unaffected.
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
# Generates a throwaway self-signed cert so the key-extraction test can assert the extracted
# bytes are the inner subjectPublicKey (a strict subset of the key pair's full SPKI DER).
rcgen.workspace = true
# Two roles in one entry (ADR-0011's 2026-08-26 role table), and they exit differently:
#   * **R2 generator** — the MCS-stage machine tests build realistic *server* frames
#     (Connect-Response, AttachUserConfirm, ChannelJoinConfirm) with ironrdp's encoders and feed
#     them to our state machine (`src/connect.rs:1251`). Their encoder against our decoder, never
#     our own bytes. **What ends it:** we write the server-side encoder, or a committed capture
#     replaces it. No corpus retires a generator — a corpus holds what a server *sent*, and these
#     tests need frames a server never sends (`:1836` patches a result byte ironrdp hardcodes).
#   * **R3 acceptance** — `ironrdp_pdu::decode` parses the frames *we* wrote (`:1897`, `:1904`,
#     `:1947`), so their decoder grades our encoder. **What ends it:** a real-server capture of
#     the client-to-server leg, which no `JUSTRDP_CONNECT_CAPTURE_FILE` run produces today.
# ADR-0011 supersedes ADR-0003 phase 3 here; this comment cited ADR-0001 until #225.
ironrdp-pdu = "0.9.0"
# Property-based robustness (ADR-0008). This is the **first** proptest dependency in the core
# crate, and it is here because the census that names what must carry a no-panic property was
# scoped to `crates/justrdp-pdu/src` and so could not see this crate at all (#241/#238). Two
# members it was blind to live here: `tls::extract_subject_public_key`, which parses a
# server-supplied X.509 through a leaf dependency, and `framebuffer`, which sizes and indexes
# from server-declared dimensions.
proptest.workspace = true
