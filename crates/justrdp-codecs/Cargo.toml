[package]
name = "justrdp-codecs"
description = "RDP graphics codecs for justrdp (phased ownership — see ADR-0003)."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

# No features. `egfx-bootstrap` is gone with #189: zgfx was its last holder, so every codec in
# this crate is self-owned and unconditional, and `ironrdp-graphics` is a dev-dependency only —
# ADR-0003 phase 3 for the whole crate, which is ADR-0011's terminal state for the runtime graph.

[dependencies]
# The TS_RFX message-set parser (issue #58): the self-owned RemoteFX decoder consumes the
# typed blocks; justrdp-pdu stays zero-dep (ADR-0002), this edge is workspace-internal.
justrdp-pdu.workspace = true

[dev-dependencies]
# The most overloaded entry in the workspace — four of ADR-0011's five roles:
#   * **R1 verifier** — diff our decode output against ironrdp's on identical bytes.
#   * **R2 generator** — its compressor/encoder authors the streams our decoders then read
#     (`tests/differential_zgfx.rs`, `rdp6_planar_decodes_ironrdp_encoder_output_identically` in
#     `tests/differential_ironrdp_graphics.rs`, `forward_coefficients` in
#     `tests/differential_rfx.rs`, `round_trips_the_oracle_encoder` in `src/clearcodec.rs`).
#     **No corpus ends this one.**
#   * **R4 canary** — `oracle_encoder_round_trips_both_modes` in `tests/differential_rfx.rs`, whose
#     subject is the oracle alone.
#   * **R5 stage-boundary math** (ADR-0007) — `dwt_extrapolate`, kept deliberately by ADR-0011's
#     #169 amendment.
# **What ends it (ADR-0011):** R1 drops per codec on an owned basis, *except* where an amendment
# keeps it as breadth (zgfx, #189). The entry itself leaves only when the last role does.
ironrdp-graphics = "0.11"
# Two of ADR-0011's roles. **R1 verifier**: `tests/differential_pointer_ironrdp.rs` wraps its own mask
# bytes in this crate's pointer-attribute types (issue #41) for the oracle's decoder to read, and
# `reference_decode` in `tests/differential_rfx.rs` parses a stream with it. **R2 generator**:
# `build_stream` in `tests/differential_rfx.rs` encodes the TS_RFX container with it. **What ends R2:**
# we write that encoder. An owned corpus does not: the real-server RemoteFX corpus (#554) spans
# RLGR1, one quantization table and single-rectangle regions, and every other stream the
# differential needs is one no server here sends (#558, the module doc of
# `tests/differential_rfx.rs`).
ironrdp-pdu = "0.11"
# Property-based robustness tests for the untrusted-input codec decoders (ADR-0008, issue #97):
# "decode never panics on arbitrary bytes". The differential oracle only checks correctness on
# hand-written valid streams; proptest stresses the malformed/adversarial input space.
proptest.workspace = true
# The per-codec benchmarks in `benches/` (#555), over the real-server corpora in `tests/fixtures/`.
criterion.workspace = true

[[bench]]
name = "real_server_corpus"
harness = false
