[package]
name = "justrdp-codecs"
description = "RDP graphics codecs for justrdp (phased ownership — see ADR-0003)."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

# No features. `egfx-bootstrap` is gone with #189: zgfx was its last holder, so every codec in
# this crate is self-owned and unconditional, and `ironrdp-graphics` is a dev-dependency only —
# ADR-0003 phase 3 for the whole crate, which is ADR-0011's terminal state for the runtime graph.

[dependencies]
# The TS_RFX message-set parser (issue #58): the self-owned RemoteFX decoder consumes the
# typed blocks; justrdp-pdu stays zero-dep (ADR-0002), this edge is workspace-internal.
justrdp-pdu.workspace = true

[dev-dependencies]
# The differential test oracle (ADR-0003): diff our decode output against ironrdp's on
# identical bytes (and use its compressor to generate valid streams for the decoders).
ironrdp-graphics = "0.9"
# Constructs the pointer-attribute inputs the ironrdp-graphics pointer oracle consumes
# (issue #41 differential tests only).
ironrdp-pdu = "0.9"
# Property-based robustness tests for the untrusted-input codec decoders (ADR-0008, issue #97):
# "decode never panics on arbitrary bytes". The differential oracle only checks correctness on
# hand-written valid streams; proptest stresses the malformed/adversarial input space.
proptest.workspace = true
