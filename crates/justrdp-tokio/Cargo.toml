[package]
name = "justrdp-tokio"
description = "Tokio I/O adapter that drives the sans-IO justrdp connect/session state machines."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
justrdp.workspace = true
justrdp-pdu.workspace = true
# "sync" + "macros" are lib (not just dev) features since slice-7: `run_session` selects over
# the socket and the host-input mpsc channel. Without them the lib only compiled via
# dev-dependency feature unification (tests passed, standalone `cargo check` did not).
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "macros"] }
# Cancel-aware session teardown (slice-8): the host signals stop via CancellationToken.
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["std", "attributes"] }
# TLS upgrade (slice-2): the adapter owns the rustls handshake (the sans-IO core never sees TLS
# records — plan.md §3). `rustls` re-exported via `tokio-rustls`.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# Server-certificate trust (issue #36): the Chain policy verifies against the OS trust store;
# TOFU mismatch errors carry SHA-256 pin fingerprints (ring is already rustls' provider here).
rustls-platform-verifier = { workspace = true }
ring = { workspace = true }
# NLA authentication (slice-3, plan.md decision 10): the adapter drives `sspi::credssp::CredSspClient`
# over the TLS stream; the sans-IO core never sees a TSRequest.
sspi = { workspace = true }

[dev-dependencies]
# "sync" feeds the SNI observed by the mock TLS server back to the test (oneshot channel).
# "test-util" gives the VM harness's frame-acknowledgement primitives (#198) virtual time, so
# they are tested against their real 2 s / 5 s / 90 s constants without spending 20 s of the
# default gate on sleeps — a real clock here would make the cheap tests the slow ones.
tokio = { workspace = true, features = [
    "net",
    "io-util",
    "time",
    "rt",
    "macros",
    "sync",
    "test-util",
] }
# Captures tracing events in-test so we can assert on the emitted debug logs (criterion 14).
# "no-env-filter" keeps events from the `justrdp` core crate (PDU-milestone targets like
# rdp_deactivate_all) visible to the slice-8 wire-sequence assertions.
tracing-test = { version = "0.2", features = ["no-env-filter"] }
# The mock TLS server in the adapter tests presents a throwaway self-signed cert.
rcgen = { workspace = true }
# **R1 verifier** (ADR-0011's 2026-08-26 table) for the live-capture codec test (gate #6 fix
# note 3): bitmap rectangles captured from the real VM are decoded by both our codecs and
# ironrdp's and asserted byte-identical (`src/lib.rs:2315` planar, `:2330` rle).
# **What ends it (ADR-0011):** an owned basis for planar and rle. Note the shape this crate is in
# — the test captures real server bytes on every VM run and **writes none of them to disk**, so
# the *acceptance* half of that basis is produced and discarded each time. Persisting it is not
# the whole job: the *values* half must not come from the oracle, or the fixture bakes the
# instrument's answer in permanently (`docs/map/invariant/oracle-agreement-is-not-independence.md`,
# violation shape 3). Left open deliberately by #225.
ironrdp-graphics = "0.9"
justrdp-codecs.workspace = true
