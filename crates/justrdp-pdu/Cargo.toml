[package]
name = "justrdp-pdu"
description = "RDP wire-format PDU encoding/decoding (sans-IO) for justrdp."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]

[dev-dependencies]
# Differential oracle for wire round-trips (`tests/differential_ironrdp.rs`,
# `tests/differential_activation.rs`), in three roles of ADR-0011's role table: **R3 acceptance** for the
# `our_*` tests, where `ironrdp_pdu::decode` parses bytes our encoders wrote; **R2 generator** for the
# `ironrdp_*` tests, where `ironrdp` encodes bytes our decoders read; **R1 verifier** for the tests that
# decode test-built bytes with both stacks or compare both encoders' bytes.
# **What ends it (ADR-0011):** R1, an owned basis for this layer — real server bytes plus expectations
# derived independently of our encoder; R2, an encoder of ours; R3, a real-server capture of the
# client-to-server leg or a VM run. `tests/fixtures/connect/` is the start of an owned basis (#203, #252)
# and `tests/real_server_connect.rs` is what reads it; every encoder in this crate writes
# client-to-server, so the oracle is currently the only thing that grades a server-to-client
# decode. This entry carried **no comment at all** until #225, which is why it is spelled out.
ironrdp-pdu = "0.11.0"
# Property-based robustness tests for the server-controlled PDU parsers (ADR-0008, issue #97):
# "decode never panics on arbitrary bytes". The differential oracle only checks correctness on
# hand-written valid streams; proptest stresses the malformed/adversarial input space. Dev-only —
# the crate itself stays zero-dependency (ADR-0002).
proptest.workspace = true
